services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3000:3000
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-equipe}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-equipe}
      ORIGIN: ${ORIGIN:?required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?required}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-equipeadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-equipeadmin}
      S3_BUCKET: ${S3_BUCKET:-equipe}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-}
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    # healthcheck:
    #   test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000']
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-equipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-equipe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-equipe} -d ${POSTGRES_DB:-equipe}']
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: 'server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=100 -ip.bind=0.0.0.0'
    restart: always
    volumes:
      - seaweedfs_data:/data
    # Inline, comme livekit_config : Coolify ne dépose que le compose dans le dossier de
    # déploiement, donc un bind mount `./docker/...` monterait un répertoire vide.
    configs:
      - source: seaweedfs_s3_config
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8333/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server
    command: --config /etc/livekit.yaml
    restart: always
    expose:
      - 7880 # HTTP / WebSocket (signal) — exposé via le reverse proxy
    ports:
      - 7881:7881 # RTC (TCP)
      - 7882:7882/udp # RTC (UDP)
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.livekit.loadbalancer.server.port=7880'
      - 'traefik.http.middlewares.livekit-cors.headers.accesscontrolalloworiginlist=https://equipe.ideastudio.dev'
      - 'traefik.http.middlewares.livekit-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS'
      - 'traefik.http.middlewares.livekit-cors.headers.accesscontrolallowheaders=*'
      - 'traefik.http.middlewares.livekit-cors.headers.accesscontrolmaxage=3600'
    configs:
      - source: livekit_config
        target: /etc/livekit.yaml

configs:
  seaweedfs_s3_config:
    content: |
      {
        "identities": [
          {
            "name": "admin",
            "credentials": [
              {
                "accessKey": "${S3_ACCESS_KEY:-equipeadmin}",
                "secretKey": "${S3_SECRET_KEY:-equipeadmin}"
              }
            ],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }

  livekit_config:
    content: |
      port: 7880
      rtc:
        tcp_port: 7881
        udp_port: 7882
        use_external_ip: true
      keys:
        ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
      logging:
        level: info

volumes:
  pgdata:
  seaweedfs_data:
